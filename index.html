<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- viewport-fit so the practice overlay can reach under the notch; zoom is
         deliberately NOT locked. The screen is read at arm's length with both
         hands on the guitar, which is exactly when someone pinches to zoom. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Daily Fret | Your Guitar Journey</title>
    
    <meta name="description" content="A premium, low-friction daily routine tracker for your guitar learning journey. Build speed, master chords, and track your daily progress elegantly." />
    <meta name="theme-color" content="#0F0F11" />

    <!-- Both faces are served from this origin. They used to come from Google
         Fonts, which cost two extra DNS+TLS handshakes and, worse, put a
         render-blocking cross-origin stylesheet ahead of everything: the splash
         below could not paint until fonts.googleapis.com answered. These are
         the latin subsets of the variable faces, so one file covers every
         weight the app uses (Outfit 400-700, Plus Jakarta Sans 400-600).

         Deliberately NOT preloaded. Measured on slow 4G, preloading the pair
         cost 350ms of first paint: 60kB of font competing with the entry chunk
         for the same pipe, to replace a fallback face nobody can read yet
         because the app has not mounted. Left to the normal font pipeline they
         are fetched when the first text using them is laid out, which is after
         the routine is already on screen. -->

    <style>
      /* Outfit and Plus Jakarta Sans, SIL Open Font License 1.1.
         `swap` so text is legible from the first frame in the system fallback
         and upgrades when the face lands; it must never hide the routine. */
      @font-face {
        font-family: 'Outfit';
        font-style: normal;
        font-weight: 400 700;
        font-display: swap;
        src: url('/fonts/outfit-latin-var.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Plus Jakarta Sans';
        font-style: normal;
        font-weight: 400 600;
        font-display: swap;
        src: url('/fonts/plus-jakarta-sans-latin-var.woff2') format('woff2');
      }

      /* Initial Loader Styles */
      #initial-loader {
        position: fixed;
        inset: 0;
        background-color: #0F0F11;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: opacity 0.28s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.28s;
      
        /* Never a hit target: it fades before it is removed, and for those few
           hundred milliseconds it was still swallowing the first tap. */
        pointer-events: none;
      }
      
      .strings-container {
        display: flex;
        flex-direction: column;
        gap: 8px;
        width: 120px;
      }

      .string {
        height: 2px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 2px;
        position: relative;
        overflow: hidden;
      }

      /* Each string gets thicker like real guitar strings (E A D G B e) */
      .string:nth-child(1) { height: 3px; }
      .string:nth-child(2) { height: 2.5px; }
      .string:nth-child(3) { height: 2px; }
      .string:nth-child(4) { height: 1.5px; }
      .string:nth-child(5) { height: 1.2px; }
      .string:nth-child(6) { height: 1px; }

      .string::after {
        content: '';
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, transparent, rgba(56, 189, 248, 0.8), transparent);
        animation: strum 1.5s infinite ease-in-out;
      }

      .string:nth-child(1)::after { animation-delay: 0.0s; }
      .string:nth-child(2)::after { animation-delay: 0.1s; }
      .string:nth-child(3)::after { animation-delay: 0.2s; }
      .string:nth-child(4)::after { animation-delay: 0.3s; }
      .string:nth-child(5)::after { animation-delay: 0.4s; }
      .string:nth-child(6)::after { animation-delay: 0.5s; }

      @keyframes strum {
        0% { left: -100%; }
        100% { left: 100%; }
      }
    </style>
  </head>
  <body>
    <div id="initial-loader">
      <div class="strings-container">
        <div class="string"></div>
        <div class="string"></div>
        <div class="string"></div>
        <div class="string"></div>
        <div class="string"></div>
        <div class="string"></div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
